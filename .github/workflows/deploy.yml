name: Build site

on:
  - push
  - workflow_dispatch

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        # e2e-тесты (npm run test:e2e) запускают Chromium — на чистом раннере
        # его нет, --with-deps ставит и системные библиотеки для headless-запуска.
        # Сами браузеры кэшируются по хешу package-lock.json (там же версия
        # @playwright/test), системные либы — тоже, но легковесны.
        run: npx playwright install --with-deps chromium

      - name: Check
        run: npm run check

      - name: Test
        run: npm run test

      - name: Build pages
        run: npm run build

      - name: Deploy to GitHub Pages
        if: success()
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: gh-pages
          build_dir: build
          fqdn: visualkapital.comtext.space
          # SvelteKit кладёт JS-чанки в _app/ — без отключения Jekyll GitHub Pages
          # проигнорирует эту папку (правило "_" по умолчанию), и сайт не откроется.
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
